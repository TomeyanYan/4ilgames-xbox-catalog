name: Sync Xbox catalog to Telegraph
on:
  schedule:
    - cron: '15 7 * * *' # 10:15 Minsk (UTC+3)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegraph-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync Telegraph
        env:
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        run: python sync.py
      - name: Save Telegraph page paths
        run: |
          if [ -f state.json ] && ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Save Telegraph catalog page paths"
            git push
          fi
